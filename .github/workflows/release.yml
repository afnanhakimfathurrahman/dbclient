# Builds the desktop apps and publishes them as a GitHub release.
# Run it by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# Asset names carry no version, so the site can link to
# releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/DB Client'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $out
          # The Visual C++ runtime, so the app starts on PCs without it.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" $out
          }
          Compress-Archive -Path $out -DestinationPath dist/db-client-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/db-client-windows-x64.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Package
        run: |
          mkdir -p dist
          cp -R build/macos/Build/Products/Release/db_client.app "dist/DB Client.app"
          # Universal binary (Apple silicon and Intel), ad-hoc signed.
          codesign --force --deep --sign - "dist/DB Client.app"
          ditto -c -k --keepParent "dist/DB Client.app" dist/db-client-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/dist/db-client-macos.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          cp -r build/linux/x64/release/bundle dist/db-client
          tar -czf dist/db-client-linux-x64.tar.gz -C dist db-client
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/dist/db-client-linux-x64.tar.gz

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
